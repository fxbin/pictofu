name: One-shot single photo selection patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-single-photo-selection.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch booth selection model
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/booth/booth-client.tsx")
          text = path.read_text()

          replacements = [
              (
                  'import { FramePicker } from "./frame-picker";\n',
                  'import { FramePicker } from "./frame-picker";\nimport { SinglePhotoPicker } from "./single-photo-picker";\n',
              ),
              (
                  '  const [savePreviewReason, setSavePreviewReason] = useState<SavePreviewReason | null>(null);\n\n  const captureBusy',
                  '  const [savePreviewReason, setSavePreviewReason] = useState<SavePreviewReason | null>(null);\n  const [singlePhotoIndex, setSinglePhotoIndex] = useState(0);\n\n  const captureBusy',
              ),
              (
                  '  const selectedLayoutTarget = shotTargetForLayout(layoutId);\n  const exportSlots = captureSlots.slice(0, selectedLayoutTarget);\n  const exportReady = exportSlots.length === selectedLayoutTarget && exportSlots.every((slot) => slot !== null) && !captureBusy && exportStatus !== "working";\n  const activeAdjustSlot',
                  '  const selectedLayoutTarget = shotTargetForLayout(layoutId);\n  const selectedSingleSlot = captureSlots[singlePhotoIndex] ?? captureSlots.find((slot): slot is CaptureSlot => slot !== null) ?? null;\n  const exportSlots = selectedLayoutTarget === 1 ? [selectedSingleSlot] : captureSlots.slice(0, selectedLayoutTarget);\n  const exportReady = exportSlots.length === selectedLayoutTarget && exportSlots.every((slot) => slot !== null) && !captureBusy && exportStatus !== "working";\n  const singlePhotoChoices = captureSlots.flatMap((slot, index) => slot ? [{ index, id: slot.slotId, url: slot.url, crop: slot.crop }] : []);\n  const activeAdjustSlot',
              ),
              (
                  '    setActiveAdjustIndex(null);\n    adjustDragRef.current = null;',
                  '    setActiveAdjustIndex(null);\n    setSinglePhotoIndex(0);\n    adjustDragRef.current = null;',
              ),
              (
                  '  function chooseFrame(nextFrame: FrameId) {\n    setFrameId(nextFrame);\n    markStyleChange("frame", nextFrame);\n  }\n\n  function selectAdjustSlot',
                  '  function chooseFrame(nextFrame: FrameId) {\n    setFrameId(nextFrame);\n    markStyleChange("frame", nextFrame);\n  }\n\n  function chooseSinglePhoto(nextIndex: number) {\n    if (!captureSlots[nextIndex] || nextIndex === singlePhotoIndex) return;\n    setSinglePhotoIndex(nextIndex);\n    closeSavePreview();\n    beginEditIfNeeded();\n    emitProductEvent("style_changed", { style_type: "source_photo", style_id: `photo-${nextIndex + 1}` });\n    setExportStatus("idle");\n    setExportMessage(null);\n  }\n\n  function selectAdjustSlot',
              ),
              (
                  '              <div className={`result-strip result-strip--${frameId} result-strip--layout-${layoutId}`} aria-label="Photo strip preview">\n                {Array.from({ length: Math.min(preset.shotCount, selectedLayoutTarget) }).map((_, index) => {\n                  const slot = captureSlots[index];\n                  return (\n                    <div className={`result-strip__photo ${slot ? "has-photo" : ""}`} key={slot?.slotId ?? `slot-${index + 1}`}>\n                      {slot ? (\n                        <img\n                          src={slot.url}\n                          alt={`Captured photo ${index + 1}`}\n                          style={{ ...cropPreviewStyle(slot.crop), filter: filterCssValue(filterId) }}\n                        />\n                      ) : <span aria-hidden="true">{index + 1}</span>}\n                    </div>\n                  );\n                })}\n                <div className="result-strip__brand">✦ PicToFu ♡</div>\n              </div>',
                  '              <div className={`result-strip result-strip--${frameId} result-strip--layout-${layoutId}`} aria-label="Photo strip preview">\n                {exportSlots.map((slot, index) => {\n                  const sourceIndex = slot ? captureSlots.indexOf(slot) : index;\n                  return (\n                    <div className={`result-strip__photo ${slot ? "has-photo" : ""}`} key={slot?.slotId ?? `slot-${index + 1}`}>\n                      {slot ? (\n                        <img\n                          src={slot.url}\n                          alt={`Captured photo ${sourceIndex + 1}`}\n                          style={{ ...cropPreviewStyle(slot.crop), filter: filterCssValue(filterId) }}\n                        />\n                      ) : <span aria-hidden="true">{index + 1}</span>}\n                    </div>\n                  );\n                })}\n                <div className="result-strip__brand">✦ PicToFu ♡</div>\n              </div>',
              ),
              (
                  '              <div className="editor-control-group">\n                <h2>Filters</h2>',
                  '              {selectedLayoutTarget === 1 && capturedCount > 1 && (\n                <div className="editor-control-group">\n                  <h2>Photo</h2>\n                  <SinglePhotoPicker\n                    photos={singlePhotoChoices}\n                    selectedIndex={singlePhotoIndex}\n                    filter={filterCssValue(filterId)}\n                    disabled={captureBusy}\n                    onSelect={chooseSinglePhoto}\n                  />\n                </div>\n              )}\n\n              <div className="editor-control-group">\n                <h2>Filters</h2>',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected patch target not found:\n{old[:180]}")
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-single-photo-selection.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/booth/booth-client.tsx app/booth/single-photo-picker.tsx app/booth/single-photo-picker.module.css .github/workflows/one-shot-single-photo-selection.yml
          git commit -m "feat: choose captured photo for one-shot templates"
          git push origin HEAD:main
