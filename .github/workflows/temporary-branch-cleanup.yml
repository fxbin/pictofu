name: Temporary Branch Cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete all remote branches except main and dev
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin \
            | awk '{sub("refs/heads/", "", $2); print $2}' \
            | while IFS= read -r branch; do
                case "$branch" in
                  main|dev)
                    echo "Keeping $branch"
                    ;;
                  *)
                    echo "Deleting $branch"
                    git push origin --delete "$branch"
                    ;;
                esac
              done
